name: Build Nicxker AI iOS 6 App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot perl zip git libtinfo6

      - name: Install Theos & iOS Cross Toolchain
        run: |
          echo "Cloning Theos..."
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          echo "Installing iOS Toolchain..."
          mkdir -p ~/theos/toolchain
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJvf - -C ~/theos/toolchain/
          
          echo "Setting up ldid..."
          sudo ln -sf ~/theos/toolchain/linux/iphone/bin/ldid /usr/local/bin/ldid
          ldid || true

      - name: Install iOS 12.4 SDK (armv7 compatible)
        run: |
          echo "Installing iOS 12.4 SDK..."
          mkdir -p ~/theos/sdks
          curl -sL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS12.4.sdk.tar.xz | tar -xJvf - -C ~/theos/sdks/
          ls -la ~/theos/sdks/

      - name: Build Nicxker AI App
        run: |
          export THEOS=$HOME/theos
          export THEOS_FLAG_NOWERROR=1
          make clean
          make THEOS_FLAG_NOWERROR=1
          mkdir -p dist/NicxkerAI.app
          cp -r .theos/obj/debug/armv7/NicxkerAI.app/* dist/NicxkerAI.app/ 2>/dev/null || cp -r .theos/obj/debug/NicxkerAI.app/* dist/NicxkerAI.app/ 2>/dev/null || cp -r .theos/obj/NicxkerAI.app/* dist/NicxkerAI.app/ 2>/dev/null || true
          cp Info.plist Icon*.png dist/NicxkerAI.app/ 2>/dev/null || true

      - name: Code Sign with ldid
        run: |
          ldid -S dist/NicxkerAI.app/NicxkerAI || true
          cd dist
          zip -r ../NicxkerAI_iOS6.zip NicxkerAI.app

      - name: Upload Compiled .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NicxkerAI_iOS6
          path: NicxkerAI_iOS6.zip
